name: Ranker
description: 'Ranker is a consumer internet company that runs ranker.com, a crowdsourced
  ranking and voting platform where users vote on and create rankings across pop culture,
  entertainment, film, TV, music, food, sports, and other consumer topics. Its business
  arm licenses "Ranker Insights" audience-intelligence and opinion-graph data - drawn
  from more than 1.5 billion votes, 115 million voters, and 260,000 rankings - to brands,
  agencies, publishers, and for AI/LLM training. Ranker does not publish a public,
  self-serve developer API; a private api.ranker.com powers the site and its robots.txt
  prohibits automated scraping and AI/LLM training use. Data access is sales-led via
  business.ranker.com. Backed by Bullpen Capital and DCVC.'
